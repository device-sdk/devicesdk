name: Firmware — Pico

on:
  push:
    branches: [main]
    paths: [firmware/pico/**, firmware/scripts/**]
  pull_request:
    branches: [main]
    paths: [firmware/pico/**, firmware/scripts/**]
  workflow_dispatch:

concurrency:
  group: firmware-pico-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: firmware/pico

jobs:
  unit-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify firmware version extraction (CMake regex regression)
        working-directory: firmware/pico
        run: cmake -DPACKAGE_JSON=package.json -P ../scripts/check_version.cmake

      - name: Restore gtest build cache
        uses: actions/cache@v6
        with:
          path: firmware/pico/test/build/_deps
          key: pico-gtest-${{ hashFiles('firmware/pico/test/CMakeLists.txt') }}
          restore-keys: |
            pico-gtest-

      - name: Build and run tests
        working-directory: firmware/pico/test
        run: |
          find build -name CMakeCache.txt -delete 2>/dev/null || true
          cmake -B build
          cmake --build build -j$(nproc)
          ./build/run_tests

  build:
    name: Build Pico firmware
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve PICO_SDK_PATH
        # `runner.*` context is not available in job-level `env:`; export it
        # via $GITHUB_ENV here so later steps can use ${{ env.PICO_SDK_PATH }}.
        run: echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"

      # cmake, ninja, and build-essential are preinstalled on ubuntu-latest; the
      # ARM cross toolchain is not. Do NOT install picotool from apt: apt ships
      # 1.1.x and pico-sdk 2.3.0 fatal-errors on any mismatched system picotool
      # (pico_init_picotool). With no picotool installed the SDK builds the
      # exact required version (2.3.0) itself via FetchContent.
      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Restore pico-sdk cache
        id: restore-pico-sdk
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.PICO_SDK_PATH }}
          # The version in the key MUST match the clone pin below: a cached SDK
          # from a different ref would silently rebuild against the wrong
          # toolchain.
          key: pico-sdk-2.3.0-${{ hashFiles('firmware/pico/pico_sdk_import.cmake') }}

      - name: Install pico-sdk
        if: steps.restore-pico-sdk.outputs.cache-hit != 'true'
        run: |
          # Pinned, not HEAD: an unpinned SDK drifted to require picotool 2.3.0
          # while the runner image shipped 2.1.1 (see TROUBLESHOOT.md). 2.3.0
          # requires exactly picotool 2.3.0, matching the runner image. When
          # bumping this pin, keep it in lockstep with the image's picotool.
          git clone --depth 1 --branch 2.3.0 https://github.com/raspberrypi/pico-sdk ${PICO_SDK_PATH}
          git -C ${PICO_SDK_PATH} submodule update --init

      - name: Save pico-sdk cache
        if: steps.restore-pico-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.PICO_SDK_PATH }}
          key: pico-sdk-2.3.0-${{ hashFiles('firmware/pico/pico_sdk_import.cmake') }}

      - name: Build firmware artifacts
        run: |
          rm -rf dist && mkdir -p dist
          DEVICESDK_BOARD=pico_w make build
          cp build/devicesdk-client.uf2 dist/devicesdk-pico-w-client.uf2
          DEVICESDK_BOARD=pico2_w make build
          cp build/devicesdk-client.uf2 dist/devicesdk-pico2-w-client.uf2

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: devicesdk-pico-firmware
          path: |
            firmware/pico/dist/devicesdk-pico-w-client.uf2
            firmware/pico/dist/devicesdk-pico2-w-client.uf2
          if-no-files-found: error

  needs-release:
    name: Check whether this firmware version is already released
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check release tag existence
        id: check
        working-directory: firmware/pico
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release counts as published only once it carries every binary
          # uploaded by publish-release (2 for Pico). Keep this
          # threshold in sync with the asset list in the publish step below.
          version=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          assets=$(gh release view "firmware-pico@v$version" --json assets -q '.assets | length' 2>/dev/null || echo 0)
          if [ "$assets" -ge 2 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish-release:
    name: Publish firmware to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, needs-release]
    if: github.event_name != 'pull_request' && needs.needs-release.outputs.publish == 'true'
    permissions:
      contents: write
    # The workflow-level default working-directory is firmware/pico, but
    # download-artifact extracts relative to the repository root and the
    # firmware-dist/ path is repo-root relative.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: devicesdk-pico-firmware
          path: firmware-dist/

      # Versioned releases per firmware family - see firmware-esp32.yml.
      # Each publish creates a unique tag so immutable-release repositories do
      # not need to delete/recreate a rolling tag. Release notes come from the
      # changeset changelog section for this version. A partial release
      # (cancelled/failed upload) is completed in place with fresh binaries;
      # the tag keeps its original commit because GitHub ignores target
      # changes for existing tags.
      - name: Upload binaries to the firmware-pico release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.needs-release.outputs.version }}"
          tag="firmware-pico@v$version"
          bash firmware/scripts/release-notes.sh \
            firmware/pico/CHANGELOG.md \
            "$version" \
            "Pico W / Pico 2 W client UF2s for @devicesdk/firmware-pico v$version." \
            > "$RUNNER_TEMP/firmware-release-notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              firmware-dist/devicesdk-pico-w-client.uf2 \
              firmware-dist/devicesdk-pico2-w-client.uf2 \
              --clobber
          else
            gh release create "$tag" \
              --target ${{ github.sha }} \
              --title "Pico firmware v$version" \
              --notes-file "$RUNNER_TEMP/firmware-release-notes.md" \
              --latest=false \
              firmware-dist/devicesdk-pico-w-client.uf2 \
              firmware-dist/devicesdk-pico2-w-client.uf2
          fi
