name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scope — no job needs write access (the changeset job only reads,
# artifacts upload via the Actions API).
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ github.ref_name }}-
            turbo-${{ github.job }}-
      - name: Biome
        run: pnpm exec biome ci apps/server apps/simulation packages/core packages/cli
      - name: ESLint (dashboard)
        run: pnpm exec turbo run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ github.ref_name }}-
            turbo-${{ github.job }}-
      - run: pnpm exec turbo run check-types

  release-notes-test:
    name: Release Notes Script Test
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - name: Test firmware/scripts/release-notes.sh
        run: |
          set -euo pipefail
          script=firmware/scripts/release-notes.sh
          bash -n "$script"

          fixture=$(mktemp)
          cat > "$fixture" <<'EOF'
          # @devicesdk/firmware-esp32

          ## 0.5.0

          ### Minor Changes

          - abc123: first bullet

          ## 0.4.0

          ### Patch Changes

          - def456: older bullet
          EOF

          if bash "$script" /nonexistent/changelog.md 0.5.0 >/dev/null 2>&1; then
            echo "expected failure: missing changelog file" >&2
            exit 1
          fi
          if bash "$script" "$fixture" 9.9.9 >/dev/null 2>&1; then
            echo "expected failure: missing version section" >&2
            exit 1
          fi
          if bash "$script" "$fixture" 0.4 >/dev/null 2>&1; then
            echo "expected failure: prefix must not match ## 0.4.0" >&2
            exit 1
          fi

          out=$(bash "$script" "$fixture" 0.5.0 "intro line")
          [ "$(printf '%s\n' "$out" | sed -n '1p')" = "intro line" ] || { echo "intro line missing" >&2; exit 1; }
          [ "$(printf '%s\n' "$out" | sed -n '2p')" = "" ] || { echo "blank line after intro missing" >&2; exit 1; }
          [ "$(printf '%s\n' "$out" | sed -n '3p')" = "### Minor Changes" ] || { echo "section heading missing" >&2; exit 1; }

          out=$(bash "$script" "$fixture" 0.4.0)
          [ "$(printf '%s\n' "$out" | sed -n '1p')" = "### Patch Changes" ] || { echo "no-intro output should start with the section heading" >&2; exit 1; }

  test:
    name: Test
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # The @devicesdk/server test script runs on Bun (via oven-sh/setup-bun).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ github.ref_name }}-
            turbo-${{ github.job }}-
      - run: pnpm exec turbo run test --filter='!@devicesdk/dashboard'

  server-e2e-tests:
    name: Server E2E Tests
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # The server e2e suite boots the real Bun server in-process (Bun.serve on an
      # ephemeral port) and drives it over HTTP + device/watcher WebSockets.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: pnpm install --frozen-lockfile
      - name: Build dependencies
        run: pnpm build --filter @devicesdk/core
      # Runs `bun test src tests --coverage`; bunfig.toml enforces the >=85%
      # line/function coverage threshold and fails the job if it regresses.
      - name: Run server e2e tests with coverage
        run: pnpm --filter @devicesdk/server test:coverage

  component-tests:
    name: Component Tests
    if: >
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run component tests
        run: pnpm test:unit
        working-directory: apps/dashboard

  e2e-tests:
    name: E2E Tests
    if: >
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.user.login == 'dependabot[bot]')
    needs: component-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # The E2E harness boots the real Bun server (apps/server) as the backend.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ github.ref_name }}-
            turbo-${{ github.job }}-
      - name: Build dependencies
        run: pnpm build --filter @devicesdk/core
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/dashboard/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/dashboard
      - name: Run E2E tests
        run: npx playwright test --config tests/e2e/playwright.config.ts
        working-directory: apps/dashboard
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/dashboard/playwright-report/
            apps/dashboard/test-results/
          retention-days: 7

  openapi-schema:
    name: OpenAPI Schema
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: pnpm install --frozen-lockfile
      - name: Build @devicesdk/core
        run: pnpm build --filter @devicesdk/core
      - name: Generate OpenAPI schema
        run: pnpm --filter @devicesdk/server run openapi

  changeset:
    name: Changeset
    if: >
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check for changeset
        run: |
          # Allow the automated changeset version PR to pass without a changeset
          if git log --oneline origin/main..HEAD | grep -q "chore: version packages"; then
            echo "Version packages commit detected, skipping changeset check"
            exit 0
          fi
          pnpm exec changeset status --since=origin/main
