# Self-hosted DeviceSDK — single container serving the API, device
# WebSockets, and the dashboard UI on one port.
#
#   docker compose up -d
#   open http://localhost:8080  (first visit creates the admin account)
#
# Devices on your LAN connect to ws://<this-machine>:8080.
services:
  devicesdk:
    image: ghcr.io/device-sdk/devicesdk:latest
    # To build from source instead:
    # build: .
    ports:
      - "8080:8080"
    volumes:
      # All persistent state: SQLite database, device scripts, firmware images.
      # Named volume (not a bind mount): on first use Docker seeds it from the
      # image's /data, which already carries bun:bun ownership - a host bind
      # mount would be created root:root and the container (uid 1000) could not
      # write to it.
      - devicesdk-data:/data
    environment:
      # The first registered user is always allowed; set this to "false"
      # afterwards to prevent further account sign-ups.
      ALLOW_REGISTRATION: "false"
      # Plain-HTTP LAN setup (http://devicesdk.local:8080): browsers drop
      # Secure cookies over plain HTTP, which breaks dashboard login. Set this
      # to "true" only when serving behind TLS (reverse proxy).
      SECURE_COOKIES: "false"
    restart: unless-stopped

volumes:
  devicesdk-data:
