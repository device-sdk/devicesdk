## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  espressif/esp_websocket_client: '*'
  espressif/led_strip: '*'
  # RMT-backed Dallas 1-Wire driver: the DS18B20 bit timing comes from the RMT
  # peripheral on chips that have one (ESP32, ESP32-C3). Chips without RMT
  # (ESP32-C61) use the component's UART backend - onewire_dht.c selects the
  # backend at compile time via SOC_RMT_SUPPORTED, so this dependency is
  # required on every target. Pinned to the 1.x line: a future 2.x could change
  # the bus API and would otherwise break the firmware build silently.
  espressif/onewire_bus: '^1.1.1'
